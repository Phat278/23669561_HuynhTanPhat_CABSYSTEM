openapi: 3.0.3

info:
  title: CAB System - User API
  description: API quản lý tài khoản người dùng
  version: 1.0.0

servers:
  - url: http://localhost:8080/api

tags:
  - name: User API
    description: Quản lý tài khoản người dùng

paths:

  /users/register:
    post:
      tags:
        - User API
      summary: Đăng ký tài khoản
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'

      responses:
        '201':
          description: Đăng ký thành công
        '400':
          description: Dữ liệu không hợp lệ
        '409':
          description: Tài khoản đã tồn tại


  /users/login:
    post:
      tags:
        - User API
      summary: Đăng nhập

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'

      responses:
        '200':
          description: Đăng nhập thành công
        '401':
          description: Sai thông tin đăng nhập


  /users/logout:
    post:
      tags:
        - User API
      summary: Đăng xuất

      security:
        - bearerAuth: []

      responses:
        '200':
          description: Đăng xuất thành công
        '401':
          description: Chưa xác thực


  /users/{userId}:

    get:
      tags:
        - User API
      summary: Xem thông tin người dùng

      security:
        - bearerAuth: []

      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer

      responses:
        '200':
          description: Lấy thông tin thành công
        '404':
          description: Không tìm thấy người dùng


    put:
      tags:
        - User API
      summary: Cập nhật thông tin người dùng

      security:
        - bearerAuth: []

      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'

      responses:
        '200':
          description: Cập nhật thành công
        '400':
          description: Dữ liệu không hợp lệ


    delete:
      tags:
        - User API
      summary: Xóa tài khoản người dùng

      security:
        - bearerAuth: []

      parameters:
        - name: userId
          in: path
          required: true
          description: ID của người dùng cần xóa
          schema:
            type: integer

      responses:
        '204':
          description: Xóa tài khoản thành công
        '401':
          description: Chưa xác thực
        '404':
          description: Không tìm thấy người dùng


components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT


  schemas:

    RegisterRequest:
      type: object
      required:
        - name
        - phone
        - password

      properties:
        name:
          type: string
          example: Nguyen Van A

        phone:
          type: string
          example: "0901234567"

        password:
          type: string
          format: password
          example: "12345678"


    LoginRequest:
      type: object
      required:
        - phone
        - password

      properties:
        phone:
          type: string
          example: "0901234567"

        password:
          type: string
          format: password
          example: "12345678"


    UserUpdateRequest:
      type: object
      properties:
        name:
          type: string
          example: Nguyen Van B

        phone:
          type: string
          example: "0909876543"
